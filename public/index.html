<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Gastos</title>
  <style>
    :root { --verde:#1f7a4d; --fundo:#f4f7f5; --texto:#13201a; --erro:#b3261e; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--fundo); color: var(--texto); margin: 0; padding: 2rem 1rem; }
    main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top: 0; color: var(--verde); }
    form { display: grid; gap: .75rem; }
    label { display: grid; gap: .25rem; font-weight: 600; font-size: .9rem; }
    input, select, button { font: inherit; padding: .55rem .7rem; border: 1px solid #b9c7bf; border-radius: 8px; }
    button { background: var(--verde); color: #fff; border: 0; cursor: pointer; font-weight: 600; }
    button.remover { background: transparent; color: var(--erro); border: 1px solid var(--erro); padding: .25rem .6rem; }
    #aviso { color: var(--erro); font-weight: 600; min-height: 1.2rem; margin: .5rem 0 0; }
    #resumo { font-weight: 700; margin: 1.25rem 0 .5rem; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
    li { display: flex; justify-content: space-between; align-items: center; gap: .75rem; border: 1px solid #dfe8e2; border-radius: 8px; padding: .6rem .8rem; }
    .vazio { color: #5b6b62; }
  </style>
</head>
<body>
<main>
  <h1>Controle de Gastos</h1>

  <form id="form" novalidate>
    <label>Descrição
      <input id="descricao" type="text" autocomplete="off">
    </label>
    <label>Valor (R$)
      <input id="valor" type="text" inputmode="decimal" autocomplete="off">
    </label>
    <label>Categoria
      <select id="categoria">
        <option>Alimentação</option>
        <option>Transporte</option>
        <option>Lazer</option>
        <option>Moradia</option>
        <option>Outros</option>
      </select>
    </label>
    <button type="submit">Adicionar gasto</button>
  </form>

  <p id="aviso" role="alert"></p>
  <p id="resumo"></p>
  <ul id="lista" aria-label="Lista de gastos"></ul>
  <p id="vazio" class="vazio"></p>
</main>

<script>
  const CHAVE = 'controle-de-gastos';
  let gastos = [];

  const brl = (n) => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }).replace(/\u00a0/g, ' ');

  function carregar() {
    try { gastos = JSON.parse(localStorage.getItem(CHAVE)) || []; } catch { gastos = []; }
  }
  function salvar() {
    localStorage.setItem(CHAVE, JSON.stringify(gastos));
  }

  function validar(descricao, valor) {
    if (descricao.trim() === '') return 'Digite uma descrição antes de adicionar.';
    if (!Number.isFinite(valor) || valor <= 0) return 'O valor precisa ser maior que zero.';
    return '';
  }

  function renderizar() {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    gastos.forEach((g) => {
      const li = document.createElement('li');
      const texto = document.createElement('span');
      texto.textContent = `${g.descricao} · ${g.categoria} · ${brl(g.valor)}`;
      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'remover';
      botao.textContent = 'Remover';
      botao.setAttribute('aria-label', `Remover ${g.descricao}`);
      botao.addEventListener('click', () => {
        gastos = gastos.filter((x) => x.id !== g.id);
        salvar();
        renderizar();
      });
      li.append(texto, botao);
      lista.appendChild(li);
    });

    const total = gastos.reduce((soma, g) => soma + g.valor, 0);
    const n = gastos.length;
    document.getElementById('resumo').textContent =
      `Total: ${brl(total)} · ${n} ${n === 1 ? 'gasto' : 'gastos'}`;
    document.getElementById('vazio').textContent = n === 0 ? 'Nenhum gasto registrado.' : '';
  }

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const descricao = document.getElementById('descricao').value;
    const valor = parseFloat(document.getElementById('valor').value.replace(',', '.'));
    const categoria = document.getElementById('categoria').value;

    const erro = validar(descricao, valor);
    document.getElementById('aviso').textContent = erro;
    if (erro) return;

    gastos.push({ id: Date.now() + Math.random(), descricao: descricao.trim(), valor, categoria });
    salvar();
    renderizar();
    document.getElementById('descricao').value = '';
    document.getElementById('valor').value = '';
    document.getElementById('descricao').focus();
  });

  carregar();
  renderizar();
</script>
</body>
</html>
